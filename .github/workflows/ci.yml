
name: CloudOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate project files
        run: |
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudops-api:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-api:ci
          format: table
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Run container and verify health
        run: |
          docker run -d --name cloudops-api-ci cloudops-api:ci

          for i in {1..15}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' cloudops-api-ci)

            if [ "$status" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Container is unhealthy!"
              docker logs cloudops-api-ci
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs cloudops-api-ci
          exit 1

      - name: Verify container runs as non-root
        run: |
          user_id=$(docker exec cloudops-api-ci id -u)

          if [ "$user_id" -eq 0 ]; then
            echo "ERROR: Container is running as root!"
            exit 1
          fi

          echo "Container is running as non-root UID: $user_id"

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker image name
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Clean up test container
        if: always()
        run: docker rm -f cloudops-api-ci || true



  deploy:
    name: Deploy to Terraform Lab EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application through SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/laknidu777/cloudops-platform:${IMAGE_TAG}"

          SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -eu

          IMAGE="__IMAGE__"
          CONTAINER="cloudops-api"
          CANDIDATE="cloudops-api-candidate"

          echo "Pulling new image: $IMAGE"
          docker pull "$IMAGE"

          docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true

          echo "Starting candidate container..."
          docker run -d \
            --name "$CANDIDATE" \
            --restart no \
            -p 127.0.0.1:3001:3000 \
            -e PORT=3000 \
            "$IMAGE"

          CANDIDATE_HEALTHY=0

          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CANDIDATE" 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              CANDIDATE_HEALTHY=1
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 2
          done

          if [ "$CANDIDATE_HEALTHY" -ne 1 ]; then
            echo "Candidate failed health check."
            docker logs "$CANDIDATE" || true
            docker rm -f "$CANDIDATE" || true
            exit 1
          fi

          echo "Candidate is healthy."

          OLD_IMAGE_ID=$(docker inspect --format='{{.Image}}' "$CONTAINER" 2>/dev/null || true)

          if [ -z "$OLD_IMAGE_ID" ]; then
            echo "Existing container not found. Refusing to replace it."
            docker rm -f "$CANDIDATE" || true
            exit 1
          fi

          echo "Previous image: $OLD_IMAGE_ID"

          docker rm -f "$CANDIDATE"
          docker rm -f "$CONTAINER"

          echo "Starting new production container..."

          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            -e PORT=3000 \
            "$IMAGE"; then

            echo "New container failed to start. Rolling back..."
            docker rm -f "$CONTAINER" || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e PORT=3000 \
              "$OLD_IMAGE_ID"
            exit 1
          fi

          NEW_HEALTHY=0

          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              NEW_HEALTHY=1
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 2
          done

          if [ "$NEW_HEALTHY" -eq 1 ]; then
            echo "Deployment successful. New container is healthy."
            exit 0
          fi

          echo "New container failed health check."
          docker logs "$CONTAINER" || true

          echo "Rolling back to previous image..."
          docker rm -f "$CONTAINER" || true

          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            -e PORT=3000 \
            "$OLD_IMAGE_ID"

          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              echo "Rollback successful. Previous version is healthy."
              exit 1
            fi

            sleep 2
          done

          echo "CRITICAL: Rollback did not become healthy."
          docker logs "$CONTAINER" || true
          exit 1
          REMOTE_SCRIPT
          )

          SCRIPT="${SCRIPT//__IMAGE__/$IMAGE}"

          PARAMETERS=$(jq -n --arg script "$SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1

