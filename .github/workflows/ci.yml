
name: CloudOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate project files
        run: |
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudops-api:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-api:ci
          format: table
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Run container and verify health
        run: |
          docker run -d --name cloudops-api-ci cloudops-api:ci

          for i in {1..15}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' cloudops-api-ci)

            if [ "$status" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Container is unhealthy!"
              docker logs cloudops-api-ci
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs cloudops-api-ci
          exit 1

      - name: Verify container runs as non-root
        run: |
          user_id=$(docker exec cloudops-api-ci id -u)

          if [ "$user_id" -eq 0 ]; then
            echo "ERROR: Container is running as root!"
            exit 1
          fi

          echo "Container is running as non-root UID: $user_id"

      - name: Log in to GitHub Container Registry
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker image name
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Clean up test container
        if: always()
        run: docker rm -f cloudops-api-ci || true


