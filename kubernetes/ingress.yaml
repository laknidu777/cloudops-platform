apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cloudops-api-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: cloudops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudops-api-service
                port:
                  number: 3000
