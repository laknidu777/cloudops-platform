apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-api

spec:
  replicas: 5

  selector:
    matchLabels:
      app: cloudops-api

  template:
    metadata:
      labels:
        app: cloudops-api

    spec:
      containers:
        - name: cloudops-api
          image: cloudops-api:2.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: cloudops-api-config
            - secretRef:
                name: cloudops-api-secret

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
